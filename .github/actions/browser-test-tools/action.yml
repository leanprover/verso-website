name: Install browser test tools
description: Installs uv and the Playwright browsers that the browser tests use.

runs:
    using: composite
    steps:
        - name: Install uv
          uses: astral-sh/setup-uv@v10.3.3
          with:
              enable-cache: true
              cache-dependency-glob: "browser-tests/pyproject.toml"

        - name: Install Playwright browsers
          shell: bash
          run: |
              uv run --project browser-tests --extra test playwright install chromium firefox --with-deps

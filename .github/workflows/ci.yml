name: CI

on:
    push:
        branches: [main]
    pull_request:
    merge_group:

jobs:
    build:
        name: Build and generate HTML
        runs-on: ubuntu-latest
        env:
            # Used for browser tests. Placing them here allows caching to work right.
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        steps:
            - uses: actions/checkout@v6.1.0

            - name: Install elan
              run: |
                  set -o pipefail
                  curl -sSfL https://github.com/leanprover/elan/releases/download/v3.0.0/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz -C "$RUNNER_TEMP"
                  "$RUNNER_TEMP/elan-init" -y --default-toolchain none
                  echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

            - name: Compute short SHA
              id: shortSHA
              run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

            - name: Cache .lake
              uses: actions/cache@v5.1.0
              with:
                  path: .lake
                  key:
                      ${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}-${{
                      hashFiles('lean-toolchain') }}-${{ steps.shortSHA.outputs.short_sha }}
                  restore-keys: |
                      ${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('lean-toolchain') }}-

            - name: Cache Playwright browsers
              uses: actions/cache@v5.1.0
              with:
                  path: .playwright-browsers
                  key: playwright-${{ runner.os }}-${{ hashFiles('browser-tests/uv.lock') }}

            # The browser test tools install while Lean builds the site.
            - parallel:
                  - name: Install browser test tools
                    uses: ./.github/actions/browser-test-tools

                  - name: Build and generate HTML
                    run: |
                        lean --version
                        lake build
                        lake exe generate-site

            - name: Run browser tests
              run: |
                  uv run --project browser-tests --extra test pytest browser-tests -v

            - name: Upload site artifact
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: site
                  path: _site

            - name: Upload site for PR deployment
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: site-for-deploy
                  path: _site
                  retention-days: 1

            - id: deploy-info
              name: Compute deployment metadata
              if: github.event_name != 'pull_request'
              run: |
                  set -e
                  echo "message=$(git log -1 --pretty=format:"%s")" >> "$GITHUB_OUTPUT"

            - name: Deploy to Netlify
              id: deploy
              uses: nwtgck/actions-netlify@v3.0.0
              if: github.event_name == 'push' && github.ref_name == 'main'
              with:
                  publish-dir: _site
                  production-branch: main
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  alias: ref-${{ github.ref_name }}
                  deploy-message:
                      "ref/${{ github.ref_name }}: ${{ steps.deploy-info.outputs.message }}"
                  enable-commit-comment: false
                  github-deployment-environment: verso-website-main
                  fails-without-credentials: true
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: "ffb7148a-a950-4fd1-9f49-758a8416bdbb"
